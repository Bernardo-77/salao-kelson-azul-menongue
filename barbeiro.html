<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    
    <title>Painel Barbeiro | Salão Kelson</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/admin.css">
    <link rel="stylesheet" href="assets/css/barbeiro.css">

    <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
</head>
<body class="admin-body">

    <!-- ========== HEADER ========== -->
    <header class="admin-header">
        <div class="admin-container admin-header__inner">
            <div class="admin-header__brand">
                <img src="assets/img/logo.png" alt="Salão Kelson" class="admin-header__logo" onerror="this.style.display='none'">
                <div class="admin-header__text">
                    <h1>Painel Barbeiro</h1>
                    <p id="barbeiroUserName">Bem-vindo...</p>
                </div>
            </div>
            <div class="admin-header__actions">
                <a href="index.html" class="admin-btn admin-btn--ghost" title="Voltar ao site">
                    <span class="material-icons">home</span>
                    <span class="admin-btn__label">Site</span>
                </a>
                <button class="admin-btn admin-btn--danger" id="btnLogout" title="Terminar sessão">
                    <span class="material-icons">logout</span>
                    <span class="admin-btn__label">Sair</span>
                </button>
            </div>
        </div>
    </header>

    <!-- ========== MAIN ========== -->
    <main class="admin-main">
        <div class="admin-container">

            <!-- ========== CARDS DE ESTATÍSTICAS ========== -->
            <section class="admin-stats">
                <div class="stat-card stat-card--today">
                    <div class="stat-card__icon">
                        <span class="material-icons">today</span>
                    </div>
                    <div class="stat-card__content">
                        <p class="stat-card__label">Hoje</p>
                        <p class="stat-card__value" id="statToday">0</p>
                        <p class="stat-card__sub" id="statTodayMoney">0 Kz</p>
                    </div>
                </div>

                <div class="stat-card stat-card--week">
                    <div class="stat-card__icon">
                        <span class="material-icons">date_range</span>
                    </div>
                    <div class="stat-card__content">
                        <p class="stat-card__label">Esta Semana</p>
                        <p class="stat-card__value" id="statWeek">0</p>
                        <p class="stat-card__sub" id="statWeekMoney">0 Kz</p>
                    </div>
                </div>

                <div class="stat-card stat-card--month">
                    <div class="stat-card__icon">
                        <span class="material-icons">calendar_month</span>
                    </div>
                    <div class="stat-card__content">
                        <p class="stat-card__label">Este Mês</p>
                        <p class="stat-card__value" id="statMonth">0</p>
                        <p class="stat-card__sub" id="statMonthMoney">0 Kz</p>
                    </div>
                </div>
            </section>

            <!-- ========== FILTROS ========== -->
            <section class="barbeiro-filtros">
                <button class="barbeiro-filtro barbeiro-filtro--active" data-filtro="pendentes">
                    <span class="material-icons">pending_actions</span>
                    Pendentes
                    <span class="barbeiro-filtro__badge" id="badgePendentes">0</span>
                </button>
                <button class="barbeiro-filtro" data-filtro="hoje">
                    <span class="material-icons">today</span>
                    Hoje
                </button>
                <button class="barbeiro-filtro" data-filtro="semana">
                    <span class="material-icons">date_range</span>
                    Esta Semana
                </button>
                <button class="barbeiro-filtro" data-filtro="todas">
                    <span class="material-icons">list</span>
                    Todas
                </button>
            </section>

            <!-- ========== LISTA DE PEDIDOS ========== -->
            <section class="barbeiro-pedidos" id="pedidosContainer">
                <div class="admin-empty">
                    <span class="material-icons">hourglass_empty</span>
                    <h3>Carregando pedidos...</h3>
                    <p>Aguarde um momento.</p>
                </div>
            </section>

        </div>
    </main>

    <!-- ========== FIREBASE SDK ========== -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <!-- ========== TEUS SCRIPTS ========== -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/barbeiro.js"></script>

</body>
</html>
